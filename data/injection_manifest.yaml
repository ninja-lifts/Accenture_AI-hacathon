# =============================================================================
# GLASSBOX INJECTION MANIFEST - GROUND TRUTH
# =============================================================================
# Validated against schemas/injection_manifest.schema.json.
#
#   >>> COMMIT THIS FILE BEFORE WRITING ANY ENGINE CODE THAT READS IT. <<<
#
# That commit hash is quoted in README.md as pre-registration proof. It is the
# single cheapest credibility move in the whole submission and it only works if
# you do it first. Once engine code exists, you cannot prove you did not tune
# ground truth to your results - and a judge who runs `git log --follow` on this
# file will see exactly which order things happened in.
#
# Rule for the rest of the build: you may fix a *bug* in the generator, and you
# may add a scenario. You may not change an existing scenario's ground_truth
# after seeing what the engine said about it. If a scenario turns out to be
# unfair or ill-posed, mark it `notes: RETIRED - <reason>` and leave it in the
# file. A retired scenario visible in git history reads as honesty. A silently
# edited one reads as fraud.
#
# Effect design rules (docs/05_DATA_STRATEGY.md §4) - these are what stop the
# benchmark from being circular:
#   - ramps, not clean steps
#   - partial spillover into neighbouring segments (controls are not pristine)
#   - a contaminated pre-period
#   - one confounded rival cause
#   - negative controls that are unmarked in the data
# =============================================================================

